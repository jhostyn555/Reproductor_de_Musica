<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión — MusicApp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: #0b0f1a;
            color: #e5e7eb;
            text-align: center;
            padding: 24px;
        }

        img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 8px;
        }

        p {
            color: #94a3b8;
            margin: 0 0 18px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            color: #04121a;
            background: linear-gradient(135deg, #22d3ee, #a78bfa);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <img src="/icons/icon-192.png" alt="MusicApp" />
        <h1>Sin conexión</h1>
        <p>Necesitas internet para escuchar música. Vuelve a intentarlo cuando tengas conexión.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
